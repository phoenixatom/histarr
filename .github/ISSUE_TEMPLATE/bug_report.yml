name: Bug report
description: Report reproducible Histarr behavior using sanitized data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Never include Plex tokens, Tautulli API keys, private IP addresses, or real viewing history.
  - type: input
    id: version
    attributes:
      label: Histarr version
      placeholder: 1.5.0
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python and operating system
      placeholder: Python 3.12 on Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use synthetic or thoroughly sanitized sample data.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: text
