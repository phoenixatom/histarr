[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "histarr"
version = "1.5.0"
description = "Export and analyze private Plex and Tautulli watch history"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
keywords = ["plex", "tautulli", "watch-history", "media", "analytics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia",
]

[project.scripts]
histarr = "histarr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
